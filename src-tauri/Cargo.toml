[package]
name = "tiqr-manager"
version = "2.117.0"
description = "TIQR Manager - local-first ticket reselling manager"
authors = ["TIQR"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tiqr_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 2.14.0: "hooks" is what makes automatic sync safe. It gives us SQLite's own
# update hook, which fires on EVERY insert, update and delete - including the
# 17 tables that carry no `updated_at` column (transfers, every lookup list),
# where a scan over timestamps would silently miss an edit. Not a new
# dependency: the same rusqlite, one more feature flag.
rusqlite = { version = "0.41", features = ["bundled", "backup", "hooks", "functions"] }
chrono = { version = "0.4", features = ["serde"] }
# 2.118.0: the clock. On a computer it is std::time itself; in a phone's browser
# (WebAssembly), where std::time has no clock, it asks JavaScript.
web-time = "1"
csv = "1"
anyhow = "1"
thiserror = "2"
percent-encoding = "2"
# Only used directly in google_sheets.rs's own test module, to decode a JWT
# segment for a self-check - jsonwebtoken depends on it too, but a crate may
# only `use` what it declares itself.
base64 = "0.22"
# 2.0.5: PKCE (RFC 7636) for the new "Sign in with Google" flow -
# google_oauth.rs generates a random code_verifier (rand) and its SHA-256
# code_challenge (sha2), the standard way an installed/desktop app proves to
# Google it's the same client that started the sign-in when it later
# exchanges the authorization code for tokens. Not used by, and not needed
# by, the existing service-account JWT flow (google_sheets.rs), which
# authenticates as a fixed machine identity rather than a human signing in.
rand = "0.9"
sha2 = "0.10"
# 2.113.0: the mail reader. ammonia (built on html5ever, the HTML parser
# Firefox's Servo uses) turns an email's HTML into markup with no script, no
# event handler and no link but http/https/mailto before it reaches the
# screen; encoding_rs reads a body in whatever charset it was sent in
# (Slovak mail still arrives as ISO-8859-2 / Windows-1250). See
# commands/mail_view.rs.
ammonia = "4"
encoding_rs = "0.8"


# 2.118.0: the computer's own parts - Tauri and its plugins, the blocking
# HTTP client, Web access's server. The phone build (WebAssembly) compiles the
# same command modules without them (see shim/ and lib.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# 2.0.52: marko reported he could open the app more than once at the same
# time (two separate windows, two separate processes) - besides being
# confusing, this is a real risk for this app specifically: two processes
# each holding their own SQLite connection to the same db_path can genuinely
# corrupt or lose writes under concurrent access, which nothing else in this
# codebase guards against (rusqlite's own locking helps within one
# connection/process, not across two separate ones). This is Tauri's own
# official plugin for exactly this - a second launch attempt hands its argv/
# cwd to the already-running instance via the callback in lib.rs and then
# exits immediately, before that second process ever reaches db::
# open_connection. Registered first in the Builder chain (see lib.rs) per
# the plugin's own documented requirement - it needs to run before anything
# else initializes, including this app's own .setup() that opens the DB.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# 2.5.2: "Forgot password?" - see lib/firebase.ts's
# PASSWORD_RESET_ACTION_CODE_SETTINGS (frontend) for the full mechanism this
# is one piece of. Registers this app's own `tiqrmanager://` URL scheme (see
# tauri.conf.json's `plugins.deep-link`) so Windows can hand the app a
# password-reset link's oobCode directly, instead of opening it in a
# browser. The `features = ["deep-link"]` added to tauri-plugin-single-
# instance above is this plugin's own documented requirement for Windows/
# Linux: without it, clicking a tiqrmanager:// link while the app is already
# running would launch a second process (see that dependency's 2.0.52
# comment on why a second process is a real problem here, not just a UI
# nuisance) instead of reaching the one already-running instance. No change
# needed to the single-instance callback itself in lib.rs - the feature flag
# makes this plugin's own event firing there automatic.
tauri-plugin-deep-link = "2"
# 2.0.5: opens the user's default system browser to Google's real sign-in
# page for the new "Sign in with Google" flow (google_oauth.rs) - the app has
# no other way to launch an external browser from Rust. Not needed by (and
# does not affect) the existing service-account flows, which never show the
# user anything in a browser.
tauri-plugin-opener = "2"
# 2.0.76: desktop notifications for the outbound-notification feature
# (commands/notifications.rs) - Tauri's own official plugin for this, same
# "official plugin, one Cargo line + one capability permission" pattern as
# every other tauri-plugin-* dependency above. 2.0.77 removed that
# feature's email channel (and its lettre dependency) but kept this one -
# desktop notifications need no per-user setup at all, exactly what marko
# asked to keep.
tauri-plugin-notification = "2"
# Google Sheets sync (Settings -> Integrations). Deliberately NOT the
# generated google-sheets4/yup-oauth2 clients - see google_sheets.rs's module
# doc comment for why a small hand-rolled REST client fits this codebase
# better. rustls-tls avoids depending on a system OpenSSL install on the
# Windows GitHub Actions runner that actually produces the shipped installer.
# Pinned to the same major version tauri-plugin-updater already pulls in
# transitively, so the dependency tree only ever builds one copy of reqwest.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls"] }
jsonwebtoken = "9"
# 2.117.0: Web access (web_access.rs) - this TIQR's screens in a browser,
# served on 127.0.0.1 only. hyper, tokio and futures-util were already in the
# build through reqwest and Tauri; axum is the small router on top of them.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# 2.118.0: TIQR in a phone's browser. `tauri` there is shim/ (lib.rs:
# `extern crate tiqr_tauri_shim as tauri`); SQLite is rusqlite's own build for
# the browser; time, randomness and the page come from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tiqr-tauri-shim = { path = "shim" }
tiqr-reqwest-shim = { path = "shim/reqwest" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.3", features = ["wasm_js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
# SQLite itself, as rusqlite uses it there, with the browser's clock and
# randomness (`wasm-bindgen`) - and the database kept in the browser's own
# storage for this site (OPFS), so it is still there next time.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }

[dev-dependencies]
# 2.117.0: Tauri's mock runtime - web_access.rs's tests hand a command to a
# window the same way a browser request does, without a real window.
tauri = { version = "2", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 2.118.0: TIQR for a phone's browser (`npm run build:phone`) - the release
# build, with the names wasm-bindgen reads to make the browser's half kept.
[profile.phone]
inherits = "release"
strip = false
