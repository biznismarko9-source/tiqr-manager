[package]
name = "tiqr-manager"
version = "2.2.10"
description = "TIQR Manager - local-first ticket reselling manager"
authors = ["TIQR"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tiqr_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# 2.0.52: marko reported he could open the app more than once at the same
# time (two separate windows, two separate processes) - besides being
# confusing, this is a real risk for this app specifically: two processes
# each holding their own SQLite connection to the same db_path can genuinely
# corrupt or lose writes under concurrent access, which nothing else in this
# codebase guards against (rusqlite's own locking helps within one
# connection/process, not across two separate ones). This is Tauri's own
# official plugin for exactly this - a second launch attempt hands its argv/
# cwd to the already-running instance via the callback in lib.rs and then
# exits immediately, before that second process ever reaches db::
# open_connection. Registered first in the Builder chain (see lib.rs) per
# the plugin's own documented requirement - it needs to run before anything
# else initializes, including this app's own .setup() that opens the DB.
tauri-plugin-single-instance = "2"
# 2.0.5: opens the user's default system browser to Google's real sign-in
# page for the new "Sign in with Google" flow (google_oauth.rs) - the app has
# no other way to launch an external browser from Rust. Not needed by (and
# does not affect) the existing service-account flows, which never show the
# user anything in a browser.
tauri-plugin-opener = "2"
# 2.0.76: desktop notifications for the outbound-notification feature
# (commands/notifications.rs) - Tauri's own official plugin for this, same
# "official plugin, one Cargo line + one capability permission" pattern as
# every other tauri-plugin-* dependency above. 2.0.77 removed that
# feature's email channel (and its lettre dependency) but kept this one -
# desktop notifications need no per-user setup at all, exactly what marko
# asked to keep.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
anyhow = "1"
thiserror = "2"
# Google Sheets sync (Settings -> Integrations). Deliberately NOT the
# generated google-sheets4/yup-oauth2 clients - see google_sheets.rs's module
# doc comment for why a small hand-rolled REST client fits this codebase
# better. rustls-tls avoids depending on a system OpenSSL install on the
# Windows GitHub Actions runner that actually produces the shipped installer.
# Pinned to the same major version tauri-plugin-updater already pulls in
# transitively, so the dependency tree only ever builds one copy of reqwest.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls"] }
jsonwebtoken = "9"
percent-encoding = "2"
# Only used directly in google_sheets.rs's own test module, to decode a JWT
# segment for a self-check - jsonwebtoken depends on it too, but a crate may
# only `use` what it declares itself.
base64 = "0.22"
# 2.0.5: PKCE (RFC 7636) for the new "Sign in with Google" flow -
# google_oauth.rs generates a random code_verifier (rand) and its SHA-256
# code_challenge (sha2), the standard way an installed/desktop app proves to
# Google it's the same client that started the sign-in when it later
# exchanges the authorization code for tokens. Not used by, and not needed
# by, the existing service-account JWT flow (google_sheets.rs), which
# authenticates as a fixed machine identity rather than a human signing in.
rand = "0.9"
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
