name: Build & Release

# 2.11.0: this workflow builds BOTH Windows and macOS. It used to be
# Windows-only (and was named build-windows.yml); the file was renamed to
# release.yml in the same change, and release.ps1's own "did the workflow file
# survive the mirror" guard was updated to match - those two must always agree,
# see that guard's comment for the 2.0.59 incident it exists to prevent.
#
# Two ways this fires:
#
# 1) Manual test build - Actions tab -> "Build Windows Installer" -> "Run workflow".
#    Builds an UNSIGNED installer and attaches it as a downloadable Artifact on
#    the run. Good for "just get me an .exe to try". Existing installs will NOT
#    auto-update from this - it's for manual testing only. Plain pushes to
#    main/master do NOT trigger this anymore - only the button does, so an
#    ordinary "git push" stays quiet and only the tag push below builds anything.
#
# 2) Real versioned release - push a tag like "v1.0.1". Builds a SIGNED
#    Windows installer AND a macOS .dmg, and publishes both as one GitHub
#    Release, together with the small "latest.json" file the app checks on
#    startup. This is what existing installs actually see
#    when they check for updates, so use this path whenever you want users to be
#    offered an update.
#
#    Before this path works you need to add one repository secret, once:
#    Settings -> Secrets and variables -> Actions -> New repository secret
#      Name:  TAURI_SIGNING_PRIVATE_KEY
#      Value: (the private updater key you were given separately - keep it secret)
#
#    To ship a real release: bump "version" in src-tauri/tauri.conf.json (and
#    package.json) to the new version number, commit, then:
#      git push
#      git tag v1.0.1
#      git push origin v1.0.1
#    The release goes live immediately once the workflow finishes - existing
#    installs will offer it the next time they check for updates.
#
# Google Sheets sync (Settings -> Integrations, 2.0.2+) needs ONE MORE
# repository secret, added the same way, and used by BOTH build paths above
# (a test build needs it too, so "Test connection" actually works before you
# ever cut a real release):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  GOOGLE_SERVICE_ACCOUNT_JSON
#     Value: the full contents of the service-account .json key file, pasted
#            as-is (it's plain JSON text, not a file upload here)
# Without this secret, both build paths still succeed - the app just reports
# "Google Sheets sync isn't available in this build" instead of erroring, see
# src-tauri/build.rs and google_sheets.rs's embedded_service_account().
#
# "Sign in with Google" (2.0.5+) needs TWO MORE repository secrets, added the
# same way, also used by BOTH build paths above:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  GOOGLE_OAUTH_CLIENT_ID
#     Value: the Client ID from a Google Cloud Console OAuth client of type
#            "Desktop app" (see REDESIGN-2.0.5-REPORT.md for how to create one)
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  GOOGLE_OAUTH_CLIENT_SECRET
#     Value: the Client Secret shown alongside that same Client ID
# Without these two secrets, both build paths still succeed - the "Sign in
# with Google" card just reports "isn't available in this build" instead of
# erroring, see src-tauri/build.rs and google_oauth.rs's
# embedded_oauth_client(). Independent of GOOGLE_SERVICE_ACCOUNT_JSON above -
# either can be present without the other.
#
# "Continue with Google" app sign-in (2.0.46+, the Welcome screen's Google
# button - a completely separate thing from "Sign in with Google" above,
# which is only about Sheets access) needs TWO MORE repository secrets,
# added the same way, also used by BOTH build paths above:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  FIREBASE_GOOGLE_OAUTH_CLIENT_ID
#     Value: the Client ID from a Google Cloud Console OAuth client of type
#            "Desktop app", created under the Firebase project's OWN Google
#            Cloud project (NOT the same project/client as
#            GOOGLE_OAUTH_CLIENT_ID above - see REDESIGN-2.0.5-REPORT.md for
#            the same Cloud Console steps, just a different project this
#            time)
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  FIREBASE_GOOGLE_OAUTH_CLIENT_SECRET
#     Value: the Client Secret shown alongside that same Client ID
# Without these two secrets, both build paths still succeed - the "Continue
# with Google" button just stays disabled instead of erroring, see
# src-tauri/build.rs and google_oauth.rs's embedded_firebase_oauth_client().
# Independent of every secret above - any of them can be present without
# the others.
#
# Automatic event category detection's AI fallback (2.0.63+, see
# ai_categorize.rs) needs ONE MORE repository secret, added the same way,
# also used by BOTH build paths above - this one is OPTIONAL:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  ANTHROPIC_API_KEY
#     Value: an API key from console.anthropic.com (Anthropic's own site, not
#            Google's) - plain text, just the key itself
# Without this secret, both build paths still succeed and category detection
# still runs - it just only ever resolves the handful of categories its free
# keyword rules can recognize for free (Motorsport/Festival/Theatre-Musical/
# Comedy) and leaves everything else (all Sports matchups, any bare
# team/artist name like "Celine Dion") uncategorized exactly like every event
# is today, see src-tauri/build.rs and ai_categorize.rs's embedded_anthropic_
# api_key(). Independent of every secret above.
#
# Outbound notifications' mobile-push channel (2.0.76+, see
# commands/notifications.rs) needs NO repository secret at all as of 2.0.78 -
# it uses ntfy.sh's public server, which has no application-level
# credential to embed (2.0.77 briefly used Pushover instead, which DID need
# one; that channel was replaced for exactly this reason). Each person just
# picks their own "topic" string in Settings -> Notifications and enters it
# on their phone's ntfy app - nothing for this workflow to configure.

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: write

# One shared matrix definition would be nice, but GitHub Actions has no YAML
# anchors - the two matrices below are deliberately identical and must be kept
# that way. macOS builds a UNIVERSAL binary (one .dmg that runs on both Apple
# Silicon and Intel) rather than two separate architecture builds, because
# marko asked for exactly one download per platform.

jobs:
  # --- Path 1: quick unsigned test build, never on tag pushes -------------
  test-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: Windows
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            label: macOS
    runs-on: ${{ matrix.platform }}
    name: Test build (${{ matrix.label }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Apple targets are required for --target universal-apple-darwin;
          # empty on Windows, where the host target is all that is needed.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          FIREBASE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_GOOGLE_OAUTH_CLIENT_ID }}
          FIREBASE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_GOOGLE_OAUTH_CLIENT_SECRET }}
          # 2.0.63: optional - automatic event category detection's AI
          # fallback (ai_categorize.rs) simply stays unconfigured (free
          # keyword rules still work) until this secret exists.
          # 2.7.0: the same secret now ALSO gates the AI Import Assistant
          # (commands/ai_import.rs), which has no free fallback of its own -
          # without it that panel reports "AI import isn't available in this
          # build" while the rest of the New Event/Order/Sale forms work
          # exactly as before.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          # No tagName/releaseId here, so tauri-action only BUILDS - it never
          # creates a release or touches latest.json. The installer is picked
          # up and uploaded as a plain workflow artifact below, the same way
          # this job has always done it (rather than relying on newer
          # tauri-action inputs this repo has never exercised).

      - name: Collect Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer (.exe) was found under src-tauri/target/release/bundle/nsis. Check the build step logs above for errors."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "dist-installer" | Out-Null
          Copy-Item $installer.FullName "dist-installer/TIQR-Manager-Windows-Setup.exe"
          Write-Host "Found installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 1)) MB"

      - name: Collect macOS disk image
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          # Universal builds land under target/universal-apple-darwin/, not
          # target/release/ - search both so this keeps working if the target
          # argument ever changes.
          dmg="$(find src-tauri/target -type f -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg was found under src-tauri/target. Check the build step logs above."
            exit 1
          fi
          mkdir -p dist-installer
          cp "$dmg" "dist-installer/TIQR-Manager-Mac.dmg"
          echo "Found disk image: $dmg"
          ls -lh dist-installer/TIQR-Manager-Mac.dmg

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TIQR-Manager-test-${{ matrix.label }}
          path: dist-installer/*
          if-no-files-found: error

  # --- Path 2: signed, versioned release - only on "v*" tag pushes --------

  # Deleting the old release has to happen ONCE, before either platform
  # builds. When this lived inside the build job it was fine with a single
  # platform, but with a matrix the second runner would delete the release the
  # first one had just published. Own job, runs first, everything else needs it.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Delete any existing GitHub release for this tag
        # release.ps1 deletes and recreates the git TAG before pushing, which
        # is what triggers this run - but a GitHub *release* (the page with
        # the uploaded assets) is a separate object that survives that tag
        # delete/recreate. If one is already sitting there from an earlier
        # attempt, the publish step below can end up updating it in place and
        # keeping its old asset filenames (still showing the old version
        # number) instead of a clean, freshly-named set - which is exactly the
        # "installer still says the old version" symptom this step prevents.
        # continue-on-error covers the normal case where this is the first
        # release ever published under this tag.
        run: gh release delete "${{ github.ref_name }}" --yes --repo "$GITHUB_REPOSITORY"
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: prepare-release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      # Serialised on purpose. Both legs publish to the SAME release and both
      # rewrite latest.json; running them one after another removes any race
      # over creating the release and makes the final manifest deterministic.
      # A release happens rarely enough that the extra wall-clock time is
      # irrelevant next to getting the updater manifest right.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: Windows
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            label: macOS
    runs-on: ${{ matrix.platform }}
    name: Release (${{ matrix.label }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # No Rust build cache here on purpose (unlike the test-build job above).
      # A cached target/ directory can let stale bundle/packaging output
      # (e.g. an old NSIS installer name/version) survive into a new signed
      # release even when the source itself is fully up to date - a real
      # release must always be a clean, from-scratch build so the shipped
      # installer can never lag behind what was actually tagged.

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. Without these the build still succeeds, but the
          # produced artifacts carry no updater signature and existing installs
          # will refuse them - see RELEASE.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization. ALL OPTIONAL and currently
          # unset: with none of them present the .dmg is simply unsigned, which
          # builds and installs fine but shows Gatekeeper's "unidentified
          # developer" warning on first open. Nothing here invents a
          # credential - these are the exact variable names the Tauri CLI
          # reads, wired up so that adding the secrets is the only step left.
          # See RELEASE.md for what each one is.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          FIREBASE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FIREBASE_GOOGLE_OAUTH_CLIENT_ID }}
          FIREBASE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.FIREBASE_GOOGLE_OAUTH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "TIQR Manager ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what changed in this version."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

  # --- Path 2b: prove the release is actually usable ----------------------
  # The updater manifest is the one artifact nobody notices is broken until
  # users silently stop getting updates. tauri-action rewrites latest.json on
  # each matrix leg; this asserts the finished manifest really ends up
  # describing BOTH platforms, and that each platform's installer is present.
  verify-release:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Verify release artifacts and updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Assets on release $TAG:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tee assets.txt

          fail=0
          grep -qiE '\.exe$'          assets.txt || { echo "::error::no Windows .exe installer on the release"; fail=1; }
          grep -qiE '\.dmg$'          assets.txt || { echo "::error::no macOS .dmg on the release"; fail=1; }
          grep -qiE '^latest\.json$'  assets.txt || { echo "::error::no latest.json - the updater has nothing to read"; fail=1; }
          if [ "$fail" -ne 0 ]; then exit 1; fi

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json --clobber
          echo "--- latest.json ---"; cat latest.json; echo

          # Both platform families must be present, and every entry must carry
          # a real signature and url - an update that downloads and is then
          # refused for an empty signature is the failure nobody notices until
          # users quietly stop updating.
          jq -e '.platforms | keys | any(startswith("windows-"))' latest.json > /dev/null \
            || { echo "::error::latest.json has no windows-* platform"; fail=1; }
          jq -e '.platforms | keys | any(startswith("darwin-"))' latest.json > /dev/null \
            || { echo "::error::latest.json has no darwin-* platform"; fail=1; }
          jq -e '.platforms | to_entries | all(.value.signature != null and .value.signature != "")' latest.json > /dev/null \
            || { echo "::error::at least one latest.json platform has an empty signature"; fail=1; }
          jq -e '.platforms | to_entries | all(.value.url != null and .value.url != "")' latest.json > /dev/null \
            || { echo "::error::at least one latest.json platform has no download url"; fail=1; }

          echo "platforms in manifest: $(jq -r '.platforms | keys | join(", ")' latest.json)"
          exit $fail
